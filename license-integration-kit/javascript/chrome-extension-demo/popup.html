<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>License Key Activation</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h2 { font-size: 16px; margin: 0 0 8px 0; color: #38bdf8; text-align: center; }
    p { font-size: 12px; color: #94a3b8; margin: 0 0 14px 0; text-align: center; }
    .input-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-family: monospace;
      box-sizing: border-box;
      font-size: 13px;
      text-transform: uppercase;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #0369a1; }
    button.secondary { background: transparent; color: #94a3b8; border: 1px solid #334155; margin-top: 8px; }
    button.secondary:hover { background: #1e293b; color: #fff; }
    #msg { margin-top: 10px; font-size: 12px; text-align: center; min-height: 18px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .card { background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; display: none; }
  </style>
</head>
<body>

  <h2>License Manager</h2>
  <p id="sub-title">Enter your license key to unlock features</p>

  <div id="unlocked-card" class="card">
    <div style="text-align: center; color: #4ade80; font-weight: bold; margin-bottom: 8px;">✓ License Active</div>
    <div style="font-size: 12px; margin-bottom: 4px;"><strong>Plan:</strong> <span id="plan-name">-</span></div>
    <div style="font-size: 12px; margin-bottom: 12px;"><strong>Expires:</strong> <span id="expire-date">-</span></div>
    <button id="deactivate-btn" class="secondary">Deactivate License</button>
  </div>

  <div id="form-container">
    <div class="input-group">
      <label for="key-input">LICENSE KEY</label>
      <input type="text" id="key-input" placeholder="XXXX-XXXX-XXXX-XXXX">
    </div>
    <button id="activate-btn">Activate License</button>

    <div style="margin: 16px 0 8px 0; text-align: center; font-size: 11px; color: #64748b;">OR GET A TRIAL</div>

    <div class="input-group">
      <input type="email" id="email-input" placeholder="your@email.com" style="text-transform: none;">
    </div>
    <button id="trial-btn" class="secondary">Request 3-Day Free Trial</button>
  </div>

  <div id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
